
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore the HwanWrites project categories and selected work previews.">
    <title>Project Gallery | HwanWrites</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .portfolio-page {
            min-height: 100vh;
            padding: 110px 7% 80px;
            background: #171917;
            color: #f4f2ee;
        }

        .portfolio-inner {
            max-width: 1100px;
            margin: 0 auto;
        }

        .portfolio-back {
            display: inline-block;
            margin-bottom: 36px;
            color: #8fba95;
            text-decoration: none;
        }

        .portfolio-heading {
            text-align: center;
            margin-bottom: 38px;
        }

        .portfolio-heading .section-label {
            color: #8fba95;
            letter-spacing: 2px;
            font-size: 12px;
        }

        .portfolio-heading h1 {
            margin: 12px 0;
            font-size: clamp(30px, 5vw, 46px);
        }

        .portfolio-heading p:last-child {
            max-width: 620px;
            margin: 0 auto;
            color: #b5b9b5;
            line-height: 1.8;
        }

        .portfolio-gallery {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .portfolio-item {
            overflow: hidden;
            border: 1px solid #343d35;
            border-radius: 10px;
            background: #202420;
        }

        .portfolio-preview {
            min-height: 230px;
            aspect-ratio: 16 / 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at center,
                rgba(55, 105, 64, 0.3), transparent 70%),
                repeating-linear-gradient(
                    0deg, transparent 0 31px,
                    rgba(143,186,149,.05) 31px 32px
                ),
                repeating-linear-gradient(
                    90deg, transparent 0 31px,
                    rgba(143,186,149,.05) 31px 32px
                ),
                #191e1a;
        }

        .portfolio-preview img {
            display: block;
            width: 100%;
            height: 100%;
            max-height: 260px;
            object-fit: contain;
        }

        .portfolio-preview .preview-label {
            color: #8fba95;
            font-size: clamp(24px, 4vw, 42px);
            font-weight: 700;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .portfolio-item-info {
            padding: 20px;
        }

        .portfolio-item-info h2 {
            font-size: 18px;
            margin: 0 0 8px;
        }

        .portfolio-item-info p {
            color: #b5b9b5;
            font-size: 14px;
            line-height: 1.7;
            margin: 0;
        }

        .portfolio-note {
            margin-top: 30px;
            text-align: center;
            color: #a6a6a6;
            font-size: 13px;
            line-height: 1.7;
        }

        @media (max-width: 650px) {
            .portfolio-page {
                padding: 80px 5% 55px;
            }

            .portfolio-gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="portfolio-page">
        <div class="portfolio-inner">

            <a class="portfolio-back" href="index.html#portfolio">
                ← Back to Project Showcase
            </a>

            <header class="portfolio-heading">
                <p class="section-label">HWANWRITES PORTFOLIO</p>
                <h1 id="category-title">Project Gallery</h1>
                <p id="category-description">
                    Explore selected work categories and visual previews.
                </p>
            </header>

            <section
                class="portfolio-gallery"
                id="portfolio-gallery"
                aria-label="Project previews">
            </section>

            <p class="portfolio-note">
                Preview gallery only. Client identities and confidential
                project files are not displayed.
            </p>

        </div>
    </main>

    ```html
<script>
    const categories = {
        research: {
            title: "Research Projects",
            description: "Explore featured research-related projects and document previews.",
            items: [
                ["Research Paper", "Featured research paper layout and presentation."],
                ["Research Proposal", "A preview of a structured research proposal."],
                ["Research Questionnaire", "A sample questionnaire layout and formatting."],
                ["Research Presentation", "A visual preview of research presentation slides."]
            ]
        },
        academic: {
            title: "Academic Projects",
            description: "Explore featured academic outputs and presentation materials.",
            items: [
                ["Academic Report", "A preview of an organized academic report."],
                ["Case Study", "A sample case study layout."],
                ["Reaction Paper", "A preview of a clearly structured written output."],
                ["Academic Presentation", "A sample of academic presentation design."]
            ]
        },
        professional: {
            title: "Professional Documents",
            description: "Explore featured business and professional document layouts.",
            items: [
                ["Business Plan", "A preview of a structured business plan."],
                ["Business Proposal", "A sample professional proposal layout."],
                ["Marketing Plan", "A preview of organized marketing content."],
                ["Professional Report", "A sample professional report presentation."]
            ]
        },
        design: {
            title: "Graphic Designs",
            description: "Explore featured graphic design and promotional materials.",
            items: [
                ["Promotional Graphics", "A space for approved promotional design previews."],
                ["Social Media Pubmats", "A space for approved social media designs."],
                ["Posters and Pubmats", "A space for approved poster and pubmat previews."],
                ["Branding Materials", "A space for approved branding design previews."]
            ]
        }
    };

    const params = new URLSearchParams(window.location.search);
    const categoryKey = params.get("category") || "research";
    const category = categories[categoryKey] || categories.research;

    document.title = category.title + " | HwanWrites";
    document.getElementById("category-title").textContent = category.title;
    document.getElementById("category-description").textContent = category.description;

    const gallery = document.getElementById("portfolio-gallery");

    category.items.forEach((item, index) => {
        const card = document.createElement("article");
        card.className = "portfolio-item";

        const preview = document.createElement("div");
        preview.className = "portfolio-preview";

        const label = document.createElement("span");
        label.className = "preview-label";
        label.textContent = "HW. / " + String(index + 1).padStart(2, "0");
        preview.appendChild(label);

        const info = document.createElement("div");
        info.className = "portfolio-item-info";

        const heading = document.createElement("h2");
        heading.textContent = item[0];

        const description = document.createElement("p");
        description.textContent = item[1];

        info.append(heading, description);
        card.append(preview, info);
        gallery.appendChild(card);
    });
</script>
</body>
</html>
